<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign in — Rithavo</title>
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/app-shell.css">
</head>
<body>
<div class="app-main" style="max-width:420px; padding-top:96px;">
  <a class="wordmark" href="/" style="justify-content:center; display:flex; margin-bottom:32px;">
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true" width="24" height="24">
      <path d="M4 5 L12.5 12 L4 19" fill="none" stroke="var(--g1)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/>
      <path d="M11 4 L21 12 L11 20" fill="none" stroke="var(--g3)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span style="margin-left:8px;">Rithavo</span>
  </a>

  <div class="card card-body">
    <h1 class="h2" style="font-size:1.4rem; margin:0;">Sign in</h1>
    <p style="font-size:0.9rem;">Enter your email and password to sign in.</p>

    <div id="banner"></div>

    <form id="password-sign-in-form">
      <div class="app-field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="app-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;" id="password-submit-btn">
        Sign In
      </button>
    </form>
    <p style="font-size:0.85rem; margin-top:8px;">
      <a href="#" id="forgot-password-link">Forgot password?</a>
    </p>

    <form id="forgot-password-form" style="display:none;">
      <div class="app-field">
        <label for="forgot-email">Email address</label>
        <input type="email" id="forgot-email" name="email" required autocomplete="email" placeholder="you@example.com">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;" id="forgot-submit-btn">
        Send password link
      </button>
      <p style="font-size:0.85rem; margin-top:8px;"><a href="#" id="back-to-sign-in-link">&larr; Back to sign in</a></p>
    </form>

    <details style="margin-top:24px;">
      <summary style="cursor:pointer; font-size:0.9rem; color:var(--ink-soft, inherit);">Sign in with email link instead</summary>
      <div style="margin-top:16px;">
        <p style="font-size:0.85rem;">We'll send a link to your email — no password needed.</p>
        <form id="sign-in-form">
          <div class="app-field">
            <label for="magic-link-email">Email address</label>
            <input type="email" id="magic-link-email" name="email" required autocomplete="email" placeholder="you@example.com">
          </div>
          <button type="submit" class="btn btn-secondary" style="width:100%; justify-content:center;" id="submit-btn">
            Send sign-in link
          </button>
        </form>
      </div>
    </details>
  </div>
</div>

<script>
// P0.5 auth hardening: a magic-link click that failed (expired, already
// used, or invalid) redirects here with ?auth_error=<code> instead of
// showing raw JSON in the browser — see /api/auth/verify. Never reveals
// the token, the underlying exception text, or whether the address has
// an account; the next action is simply the same email form below.
(() => {
  const code = new URLSearchParams(window.location.search).get("auth_error");
  if (!code) return;
  const messages = {
    expired: "That sign-in link has expired. Enter your email below to get a new one.",
    used: "That sign-in link has already been used. Enter your email below to get a new one.",
    invalid: "That sign-in link isn't valid. Enter your email below to get a new one.",
  };
  const message = messages[code] || "That sign-in link didn't work. Enter your email below to get a new one.";
  document.getElementById("banner").innerHTML = `<div class="app-banner app-banner-error">${message}</div>`;
})();

document.getElementById("password-sign-in-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const banner = document.getElementById("banner");
  const btn = document.getElementById("password-submit-btn");
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  banner.innerHTML = "";
  btn.disabled = true;
  btn.textContent = "Signing in…";
  try {
    const resp = await fetch("/api/auth/login", {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    const data = await resp.json().catch(() => null);
    if (!resp.ok) {
      const message = (data && data.detail) ? data.detail : "Something went wrong. Please try again.";
      banner.innerHTML = `<div class="app-banner app-banner-error">${message}</div>`;
      btn.disabled = false;
      btn.textContent = "Sign In";
      return;
    }
    window.location = data.redirect;
  } catch (err) {
    banner.innerHTML = `<div class="app-banner app-banner-error">Something went wrong. Please try again.</div>`;
    btn.disabled = false;
    btn.textContent = "Sign In";
  }
});

document.getElementById("forgot-password-link").addEventListener("click", (e) => {
  e.preventDefault();
  document.getElementById("password-sign-in-form").style.display = "none";
  document.querySelector('label[for="password"]').parentElement.style.display = "none";
  document.getElementById("forgot-password-link").parentElement.style.display = "none";
  document.getElementById("forgot-password-form").style.display = "";
  document.getElementById("banner").innerHTML = "";
});

document.getElementById("back-to-sign-in-link").addEventListener("click", (e) => {
  e.preventDefault();
  document.getElementById("forgot-password-form").style.display = "none";
  document.getElementById("password-sign-in-form").style.display = "";
  document.getElementById("forgot-password-link").parentElement.style.display = "";
  document.getElementById("banner").innerHTML = "";
});

document.getElementById("forgot-password-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const banner = document.getElementById("banner");
  const btn = document.getElementById("forgot-submit-btn");
  const email = document.getElementById("forgot-email").value.trim();
  banner.innerHTML = "";
  btn.disabled = true;
  btn.textContent = "Sending…";
  try {
    const resp = await fetch("/api/auth/password/forgot", {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email }),
    });
    const data = await resp.json().catch(() => null);
    const message = (data && data.message) ? data.message : "If that email has a Rithavo account, we've sent a password link.";
    banner.innerHTML = `<div class="app-banner app-banner-success">${message}</div>`;
    document.getElementById("forgot-password-form").style.display = "none";
  } catch (err) {
    banner.innerHTML = `<div class="app-banner app-banner-error">Something went wrong. Please try again.</div>`;
    btn.disabled = false;
    btn.textContent = "Send password link";
  }
});

document.getElementById("sign-in-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const banner = document.getElementById("banner");
  const btn = document.getElementById("submit-btn");
  const email = document.getElementById("magic-link-email").value.trim();
  banner.innerHTML = "";
  btn.disabled = true;
  btn.textContent = "Sending…";
  try {
    const resp = await fetch("/api/auth/start", {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: "email=" + encodeURIComponent(email),
    });
    const data = await resp.json().catch(() => null);
    if (!resp.ok) {
      const message = (data && data.detail) ? data.detail : "Something went wrong. Please try again.";
      banner.innerHTML = `<div class="app-banner app-banner-error">${message}</div>`;
      btn.disabled = false;
      btn.textContent = "Send sign-in link";
      return;
    }
    banner.innerHTML = `<div class="app-banner app-banner-success">Check your email — we've sent a sign-in link to ${email}. It expires in 15 minutes and works once.</div>`;
    document.getElementById("sign-in-form").style.display = "none";
  } catch (err) {
    banner.innerHTML = `<div class="app-banner app-banner-error">Something went wrong. Please try again.</div>`;
    btn.disabled = false;
    btn.textContent = "Send sign-in link";
  }
});
</script>
</body>
</html>
