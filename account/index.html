<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Account — Rithavo</title>
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/app-shell.css">
</head>
<body>
<div class="app-topbar" id="app-topbar"></div>

<div class="app-main" style="max-width:480px;">
  <p class="label">Account</p>
  <h1 class="h2" style="margin:8px 0 24px;">Account</h1>
  <div class="card card-body">
    <div><span class="label">Signed in as</span><p id="email" style="color:var(--ink); font-weight:600;">…</p></div>
    <button class="btn btn-ghost" id="sign-out-btn">Sign out</button>
  </div>
</div>

<script src="/app-shell.js"></script>
<script>
(async () => {
  const me = await RithavoApp.requireSession();
  if (!me) return;
  RithavoApp.renderTopbar("account", me.email, me.is_super_admin);
  document.getElementById("email").textContent = me.email;
  document.getElementById("sign-out-btn").addEventListener("click", () => RithavoApp.signOut());
})();
</script>
</body>
</html>
