<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Account — Rithavo</title>
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preload" href="/assets/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/app-shell.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121116" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/assets/pwa/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rithavo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="/pwa.css">
</head>
<body>
<script src="/assets/ritanya/ritanya.js" defer></script>
<div class="app-topbar" id="app-topbar"></div>

<div class="app-main" style="max-width:480px;">
  <p class="label">Account</p>
  <h1 class="h2" style="margin:8px 0 24px;">Account</h1>
  <div class="card card-body">
    <div><span class="label">Signed in as</span><p id="email" style="color:var(--ink); font-weight:600;">…</p></div>
    <button class="btn btn-ghost" id="sign-out-btn">Sign out</button>
  </div>
  <div class="card card-body" data-pwa-install hidden style="margin-top:16px;"></div>
</div>

<script src="/app-shell.js"></script>
<script>
(async () => {
  const me = await RithavoApp.requireSession();
  if (!me) return;
  RithavoApp.renderTopbar("account", me.email, me.is_super_admin);
  document.getElementById("email").textContent = me.email;
  document.getElementById("sign-out-btn").addEventListener("click", () => RithavoApp.signOut());
})();
</script>
<script src="/pwa.js" defer></script>
</body>
</html>
