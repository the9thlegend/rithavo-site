<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Home — Rithavo</title>
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preload" href="/assets/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/app-shell.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121116" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/assets/pwa/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rithavo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="/pwa.css">
</head>
<body>
<script src="/assets/ritanya/ritanya.js" defer></script>
<div class="app-topbar" id="app-topbar"></div>

<div class="app-main app-main-wide">
  <div id="content" class="app-skeleton">Loading your account…</div>
</div>

<script src="/app-shell.js"></script>
<script src="/explore-feed.js"></script>
<script>
(async () => {
  const me = await RithavoApp.requireSession();
  if (!me) return; // redirected to /sign-in/

  RithavoApp.renderTopbar("home", me.email, me.is_super_admin);

  const content = document.getElementById("content");
  let profile = null;
  try {
    profile = await RithavoApp.apiJson("/profile");
  } catch (e) {
    // Non-fatal — the shell still works without a shared profile yet.
  }

  const hasProfile = profile && profile.career_profile;

  // Read-only, and only asked for once a Profile exists: it only chooses which on-domain status wording to show
  // (the Card is not available on rithavo.com; nothing here sends anyone to another host). Non-fatal.
  let hasCard = false;
  if (hasProfile) {
    try {
      const status = await RithavoApp.apiJson("/card/status");
      hasCard = !!status.has_card;
    } catch (e) {
      // Non-fatal — see above.
    }
  }

  // P0.5A: identity panel — name/headline/current role read from the
  // same shared profile_json every other rithavo.com page already
  // parses this way (see profile/index.html's loadSharedProfile).
  let displayName = me.email;
  let identityMeta = "";
  if (hasProfile) {
    try {
      const parsed = JSON.parse(profile.career_profile.profile_json || "{}");
      const idFields = parsed.identity || {};
      const bg = parsed.background || {};
      const name = idFields.name && idFields.name.value;
      if (name) displayName = name;
      const metaParts = [];
      if (idFields.headline && idFields.headline.value) metaParts.push(idFields.headline.value);
      else if (bg.current_role && bg.current_role.value) metaParts.push(bg.current_role.value);
      if (idFields.location && idFields.location.value) metaParts.push(idFields.location.value);
      identityMeta = metaParts.join(" · ");
    } catch (e) {
      // Malformed/partial profile_json — fall back to email, no subtitle.
    }
  }
  const avatarInitial = (displayName.trim().charAt(0) || "R").toUpperCase();

  // Home/Explore/Admin Integration Phase — Home is now Explore-centered:
  // the professional-news feed is the dominant content area, and every
  // pre-existing account/product link (Profile, Career Intelligence,
  // Application Diagnosis, Resumes, History, Account) moves into a
  // secondary-navigation rail alongside it, plus the new Mentorship
  // entry point. Nothing that worked before stops working — every href
  // below is unchanged from the previous tile grid.
  content.className = "";
  content.innerHTML = `
    <div class="app-identity-panel">
      <div class="app-avatar" id="app-avatar" aria-hidden="true">${avatarInitial}</div>
      <div>
        <p class="label" style="margin:0;">Welcome back</p>
        <h1 class="h2" style="margin:4px 0 0;">${displayName}</h1>
        ${identityMeta ? `<p class="app-identity-meta">${identityMeta}</p>` : ""}
      </div>
    </div>

    <div class="card rtn-slot" data-ritanya-slot hidden>
      <img class="rtn-slot-img" src="/assets/ritanya/art/pose-present.webp" width="152" height="304" alt="Ritanya, Rithavo's guide" decoding="async">
      <div class="rtn-slot-copy">
        <span class="label">Ritanya, Rithavo's guide</span>
        <p>I can tell you what each part of Rithavo does and where to find it. I can't see your account or give personal career advice.</p>
        <button type="button" class="btn btn-ghost" data-ritanya-open>Ask Ritanya</button>
      </div>
    </div>

    ${hasProfile ? "" : `
      <a href="/profile/" class="app-banner app-banner-info" style="display:block; text-decoration:none; color:inherit;">
        We don't have a Rithavo Profile on file for this account yet. Application Diagnosis and
        Career Intelligence both use your Profile — add your education and experience to get started.
      </a>
    `}

    ${hasProfile ? `
      <div class="card" style="margin-bottom:28px;" id="card-status">
        <div class="card-body" style="flex-direction:row; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap;">
          <div>
            <span class="tag">Rithavo Card</span>
            <h3 style="margin:6px 0 6px;">${hasCard ? "You have a Rithavo Card from an earlier step" : "Your Rithavo Profile is ready"}</h3>
            <p style="margin:0; max-width:52ch;" id="card-status-copy">
              The Rithavo Card is your foundational professional identity, built from your Profile, and completing it is mandatory for every member.
              It isn't available on rithavo.com yet${hasCard ? ", so it can't be viewed or shared from here" : ""}. For now, keep your Rithavo Profile up to date here.
            </p>
          </div>
          <div class="row gap-12" style="flex-wrap:wrap;">
            <a class="btn btn-primary" href="/profile/" style="white-space:nowrap;">Open your Profile</a>
          </div>
        </div>
      </div>
    ` : ""}

    <div class="home-shell">
      <aside class="home-rail">
        <details class="home-rail-menu" open>
          <summary>Your Rithavo</summary>
          <nav class="home-rail-links">
            <a href="/profile/">Your Profile</a>
            <a href="/career-intelligence/">Career Intelligence</a>
            <a href="/application-diagnosis/">Application Diagnosis</a>
            <a href="/resumes/">Your Resumes</a>
            <a href="/mentorship/">Mentorship</a>
            <a href="/history/">History</a>
            <a href="/account/">Account</a>
          </nav>
        </details>
      </aside>

      <div class="home-main">
        <p class="label" style="margin:0 0 4px;">Explore</p>
        <h2 style="margin:0 0 20px; font-family:var(--font-display);">What's happening in the professional world.</h2>
        <div id="explore-root"></div>
      </div>
    </div>
  `;

  RithavoExplore.mount(document.getElementById("explore-root"));

  // P0.5A-3 — best-effort swap of the initial-letter avatar for the
  // user's actual current Card photo.
  (async () => {
    try {
      const resp = await RithavoApp.apiFetch("/profile/photo");
      if (!resp.ok) return;
      const blob = await resp.blob();
      const avatarEl = document.getElementById("app-avatar");
      if (!avatarEl) return;
      avatarEl.style.backgroundImage = `url(${URL.createObjectURL(blob)})`;
      avatarEl.style.backgroundSize = "cover";
      avatarEl.style.backgroundPosition = "center";
      avatarEl.textContent = "";
    } catch (e) {
      // Non-fatal — keep the initial-letter avatar.
    }
  })();
})();
</script>
<script src="/pwa.js" defer></script>
</body>
</html>
