<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Home — Rithavo</title>
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/app-shell.css">
</head>
<body>
<div class="app-topbar" id="app-topbar"></div>

<div class="app-main">
  <div id="content" class="app-skeleton">Loading your account…</div>
</div>

<script src="/app-shell.js"></script>
<script>
(async () => {
  const me = await RithavoApp.requireSession();
  if (!me) return; // redirected to /sign-in/

  RithavoApp.renderTopbar("home", me.email);

  const content = document.getElementById("content");
  let profile = null;
  try {
    profile = await RithavoApp.apiJson("/profile");
  } catch (e) {
    // Non-fatal — the shell still works without a shared profile yet.
  }

  const hasProfile = profile && profile.career_profile;

  // Phase P0.2: read-only, and only ever asked for once a Profile
  // exists — never used to decide whether to create anything, only
  // which CTA wording to show. Non-fatal: if this fails, the CTA
  // simply defaults to "Generate," the same as a brand-new Card.
  let hasCard = false;
  if (hasProfile) {
    try {
      const status = await RithavoApp.apiJson("/card/status");
      hasCard = !!status.has_card;
    } catch (e) {
      // Non-fatal — see above.
    }
  }

  // P0.5A: identity panel — name/headline/current role read from the
  // same shared profile_json every other rithavo.com page already
  // parses this way (see profile/index.html's loadSharedProfile).
  // P0.5A-3: the initial-letter avatar rendered below is still the
  // default/fallback state, but is replaced with the user's actual
  // Card photo (if one exists) by the fetch("/api/profile/photo") call
  // further down — see that call's own comment for why this never
  // shows a broken image or a technical error on any failure.
  let displayName = me.email;
  let identityMeta = "";
  if (hasProfile) {
    try {
      const parsed = JSON.parse(profile.career_profile.profile_json || "{}");
      const idFields = parsed.identity || {};
      const bg = parsed.background || {};
      const name = idFields.name && idFields.name.value;
      if (name) displayName = name;
      const metaParts = [];
      if (idFields.headline && idFields.headline.value) metaParts.push(idFields.headline.value);
      else if (bg.current_role && bg.current_role.value) metaParts.push(bg.current_role.value);
      if (idFields.location && idFields.location.value) metaParts.push(idFields.location.value);
      identityMeta = metaParts.join(" · ");
    } catch (e) {
      // Malformed/partial profile_json — fall back to email, no subtitle.
    }
  }
  const avatarInitial = (displayName.trim().charAt(0) || "R").toUpperCase();

  content.className = "";
  content.innerHTML = `
    <div class="app-identity-panel">
      <div class="app-avatar" id="app-avatar" aria-hidden="true">${avatarInitial}</div>
      <div>
        <p class="label" style="margin:0;">Welcome back</p>
        <h1 class="h2" style="margin:4px 0 0;">${displayName}</h1>
        ${identityMeta ? `<p class="app-identity-meta">${identityMeta}</p>` : ""}
      </div>
    </div>

    ${hasProfile ? "" : `
      <div class="app-banner app-banner-info">
        We don't have a Rithavo Profile on file for this account yet. Application Diagnosis and
        Career Intelligence both use your Profile — add your education and experience to get started.
      </div>
    `}

    ${hasProfile ? `
      <div class="card card-hover" style="margin-bottom:28px;">
        <div class="card-body" style="flex-direction:row; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap;">
          <div>
            <span class="tag">Your Rithavo Card</span>
            <h3 style="margin:6px 0 6px;">${hasCard ? "Your profile, ready to share" : "Your profile is ready"}</h3>
            <p style="margin:0; max-width:52ch;" id="card-cta-copy">
              Your Rithavo Profile is the foundation — your Rithavo Card is the polished, shareable
              version of it.
            </p>
          </div>
          <div class="row gap-12" style="flex-wrap:wrap;">
            ${hasCard ? `
              <button type="button" class="btn btn-primary card-handoff-btn" id="card-view-btn" style="white-space:nowrap;">View Your Rithavo Card</button>
              <button type="button" class="btn btn-ghost card-handoff-btn" id="card-share-btn" style="white-space:nowrap;">Manage Card Sharing</button>
            ` : `
              <button type="button" class="btn btn-primary card-handoff-btn" id="card-continue-btn" style="white-space:nowrap;">Generate Your Rithavo Card</button>
            `}
          </div>
        </div>
        <div id="card-cta-error"></div>
      </div>
      <form id="card-handoff-form" method="POST" style="display:none;">
        <input type="hidden" name="token">
      </form>
    ` : ""}

    <div class="app-tile-grid">
      <a class="card card-hover app-tile" href="/profile/">
        <span class="tag">Profile</span>
        <h3>Your Rithavo Profile</h3>
        <p>Education, experience, and the details Rithavo uses across every product.</p>
      </a>
      <a class="card card-hover app-tile" href="/career-intelligence/">
        <span class="tag">Career Intelligence</span>
        <h3>Where your career stands</h3>
        <p>Understand your current role, and what other roles or industries could look like.</p>
      </a>
      <a class="card card-hover app-tile" href="/application-diagnosis/">
        <span class="tag">Application Diagnosis</span>
        <h3>Diagnose a job application</h3>
        <p>Paste a job description and see exactly how your profile matches it.</p>
      </a>
      <a class="card card-hover app-tile" href="/resumes/">
        <span class="tag">Resumes</span>
        <h3>Your resumes</h3>
        <p>Every resume Rithavo has generated for you.</p>
      </a>
      <a class="card card-hover app-tile" href="/history/">
        <span class="tag">History</span>
        <h3>Purchases &amp; past diagnoses</h3>
        <p>A record of what you've bought and what Rithavo has told you.</p>
      </a>
      <a class="card card-hover app-tile" href="/account/">
        <span class="tag">Account</span>
        <h3>Account</h3>
        <p>Sign out of Rithavo.</p>
      </a>
    </div>
  `;

  // P0.5A-3: best-effort swap of the initial-letter avatar for the
  // user's actual current Card photo. GET /api/profile/photo is a
  // same-origin, session-authenticated proxy — the browser never talks
  // to app.rithavo.com directly and never sees the server-to-server
  // token that fetches it (see app/photo_access.py). The <img> is only
  // ever created on a genuine 200 response, so a user with no Card, no
  // selected photo, or an unreachable sibling simply keeps the avatar
  // exactly as it already renders above — no broken-image icon, no
  // error shown.
  (async () => {
    try {
      const resp = await RithavoApp.apiFetch("/profile/photo");
      if (!resp.ok) return;
      const blob = await resp.blob();
      const avatarEl = document.getElementById("app-avatar");
      if (!avatarEl) return;
      avatarEl.style.backgroundImage = `url(${URL.createObjectURL(blob)})`;
      avatarEl.style.backgroundSize = "cover";
      avatarEl.style.backgroundPosition = "center";
      avatarEl.textContent = "";
    } catch (e) {
      // Non-fatal — keep the initial-letter avatar.
    }
  })();

  // Phase P0.2: Profile -> Rithavo Card handoff. This never touches
  // Card data itself — it mints a short-lived, single-use token
  // server-side (POST /api/card/continue) and hands the browser off to
  // the sibling app in one real cross-origin navigation, so the same
  // already-authenticated rithavo.com visitor lands on their existing
  // Rithavo Card without a second manual sign-in. A plain <a href>
  // can't do this: the token must travel in a POST body (never a URL,
  // where it could leak via logs/referrer), which needs a real
  // auto-submitted form, not a link.
  // P0.5A-2: "View Your Rithavo Card" and "Manage Card Sharing" both
  // start the exact same, already-authorized handoff (POST
  // /api/card/continue -> auto-submitted form -> the sibling's own
  // unmodified GET /card) — there is only one Card destination to hand
  // off to, and the sibling's own Card page is the authoritative place
  // for Card management and sharing (public link, mutual-follow-gated
  // Card Share). "Manage Card Sharing" replaces the earlier "Share Your
  // Rithavo Card" label (P0.5A-1 finding): that wording implied a
  // generic public share action rithavo.com doesn't actually perform —
  // Card Share is a private, mutual-follow-gated contact exchange, not
  // a broadcastable link. This is deliberately the same mechanism
  // twice, not two different flows, so it can never duplicate or
  // diverge from Card creation/provisioning.
  document.querySelectorAll(".card-handoff-btn").forEach((cardBtn) => {
    cardBtn.addEventListener("click", async () => {
      const errorBox = document.getElementById("card-cta-error");
      errorBox.innerHTML = "";
      cardBtn.disabled = true;
      const originalLabel = cardBtn.textContent;
      cardBtn.textContent = "One moment…";
      try {
        const { handoff_url, token } = await RithavoApp.apiJson("/card/continue", {
          method: "POST", body: JSON.stringify({}),
        });
        const form = document.getElementById("card-handoff-form");
        form.action = handoff_url;
        form.querySelector('input[name="token"]').value = token;
        form.submit();
        // Deliberately no re-enable here — the page is navigating away.
      } catch (e) {
        cardBtn.disabled = false;
        cardBtn.textContent = originalLabel;
        RithavoApp.banner(errorBox, "error", "Couldn't start that just now — please try again.");
      }
    });
  });
})();
</script>
</body>
</html>
