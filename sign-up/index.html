<!--
  P0 UX redesign — "Start Building" lands here. Mechanically identical
  to /sign-in/ (same magic-link start endpoint; there is no separate
  password/account-creation step in this architecture — get_or_create_user
  handles both "returning" and "brand-new" transparently), distinguished
  only by copy/branding to match the primary CTA's own promise. Where a
  visitor actually ends up after clicking the emailed link is decided
  entirely server-side by /api/auth/verify (home/ for an existing
  profile, onboarding/ for a brand-new one) — this page doesn't need to
  know or care which.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Start building — Rithavo</title>
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/app-shell.css">
</head>
<body>
<div class="app-main" style="max-width:420px; padding-top:96px;">
  <a class="wordmark" href="/" style="justify-content:center; display:flex; margin-bottom:32px;">
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true" width="24" height="24">
      <path d="M4 5 L12.5 12 L4 19" fill="none" stroke="var(--g1)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/>
      <path d="M11 4 L21 12 L11 20" fill="none" stroke="var(--g3)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span style="margin-left:8px;">Rithavo</span>
  </a>

  <div class="card card-body">
    <h1 class="h2" style="font-size:1.4rem; margin:0;">Start building</h1>
    <p style="font-size:0.9rem;">Enter your email — no password needed. We'll send you a link to create your Rithavo account and get started.</p>

    <div id="banner"></div>

    <form id="sign-up-form">
      <div class="app-field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;" id="submit-btn">
        Start building
      </button>
    </form>

    <p style="font-size:0.85rem; margin-top:8px; text-align:center;">Already have an account? <a href="/sign-in/">Sign in</a></p>
  </div>
</div>

<script>
document.getElementById("sign-up-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const banner = document.getElementById("banner");
  const btn = document.getElementById("submit-btn");
  const email = document.getElementById("email").value.trim();
  banner.innerHTML = "";
  btn.disabled = true;
  btn.textContent = "Sending…";
  try {
    const resp = await fetch("/api/auth/start", {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: "email=" + encodeURIComponent(email),
    });
    const data = await resp.json().catch(() => null);
    if (!resp.ok) {
      const message = (data && data.detail) ? data.detail : "Something went wrong. Please try again.";
      banner.innerHTML = `<div class="app-banner app-banner-error">${message}</div>`;
      btn.disabled = false;
      btn.textContent = "Start building";
      return;
    }
    banner.innerHTML = `<div class="app-banner app-banner-success">Check your email — we've sent a link to ${email} to get you started. It expires in 15 minutes and works once.</div>`;
    document.getElementById("sign-up-form").style.display = "none";
  } catch (err) {
    banner.innerHTML = `<div class="app-banner app-banner-error">Something went wrong. Please try again.</div>`;
    btn.disabled = false;
    btn.textContent = "Start building";
  }
});
</script>
</body>
</html>
