<!--
  Phase 2B-1.7A — reads the caller's existing Career Intelligence
  results via GET /api/career-intelligence (a read-only presentation
  adapter over already-persisted sibling-app data; see
  rithavo-web-platform/app/career_intelligence.py). The CLASSIFICATION
  label (Stay / New Role / New Industry / Major Transition) is this
  service's own inference from which target fields are populated —
  there is no stored field for it anywhere — flagged in the phase
  report for confirmation. "Create My Resume for..." is shown as the
  correct label but is not yet wired to a working action: generating a
  NEW resume for a Career Intelligence target requires the sibling
  app's own resume-building capability, which this service doesn't
  have access to. Clicking it says so honestly rather than pretending.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Career Intelligence — Rithavo</title>
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/app-shell.css">
</head>
<body>
<div class="app-topbar" id="app-topbar"></div>

<div class="app-main app-main-wide">
  <p class="label">Career Intelligence</p>
  <h1 class="h2" style="margin:8px 0 24px;">Where your career stands</h1>
  <div id="content" class="app-skeleton">Loading…</div>
</div>

<script src="/app-shell.js"></script>
<script>
const CLASSIFICATION_LABEL = {
  STAY: "Stay / Current Career",
  NEW_ROLE: "New Role",
  NEW_INDUSTRY: "New Industry",
  MAJOR_TRANSITION: "Major Transition",
};

function targetLabel(t) {
  if (!t) return "your current career";
  return t.name || (t.type === "ROLE" ? "a new role" : "a new industry");
}

(async () => {
  const me = await RithavoApp.requireSession();
  if (!me) return;
  RithavoApp.renderTopbar("career-intelligence", me.email);

  const content = document.getElementById("content");
  let data;
  try {
    data = await RithavoApp.apiJson("/career-intelligence");
  } catch (err) {
    content.innerHTML = `<div class="app-banner app-banner-error">${err.message}</div>`;
    return;
  }

  if (!data.has_assessment) {
    content.innerHTML = `<div class="app-banner app-banner-info">
      You don't have a completed Career Intelligence assessment yet. Career Intelligence
      (₹799 one-time) helps you understand whether you're doing well in your current role,
      whether you could do better elsewhere, and what other roles or industries could look
      like — contact hello@rithavo.com to get started.
    </div>`;
    return;
  }

  const standing = data.current_standing;
  content.innerHTML = `
    <div class="card card-body">
      <span class="label">Your direction</span>
      <h2 class="h3" style="margin:0;">${CLASSIFICATION_LABEL[data.classification] || data.classification}</h2>
      <p>${data.stated_direction_fit_summary || ""}</p>
      ${data.primary_target ? `<p style="color:var(--ink);">Target: <strong>${targetLabel(data.primary_target)}</strong></p>` : ""}
    </div>

    ${standing ? `
      <h3 class="h3" style="margin-top:32px;">Current standing</h3>
      <div class="card card-body" style="margin-top:16px;">
        <p><strong style="color:var(--ink);">Current fit:</strong> ${standing.current_fit_band}</p>
        <p><strong style="color:var(--ink);">Transferable fit:</strong> ${standing.transferable_fit_band}</p>
        <p><strong style="color:var(--ink);">Transition effort:</strong> ${standing.transition_effort_band}</p>
        <p>${standing.reasoning || ""}</p>
      </div>
    ` : ""}

    ${data.alternative_targets && data.alternative_targets.length ? `
      <h3 class="h3" style="margin-top:32px;">Alternatives considered</h3>
      <ul class="app-list" style="margin-top:16px;">
        ${data.alternative_targets.map(t => `<li class="card app-list-row"><div>${targetLabel(t)}</div></li>`).join("")}
      </ul>
    ` : ""}

    ${data.gaps && data.gaps.length ? `
      <h3 class="h3" style="margin-top:32px;">What's missing</h3>
      <div style="margin-top:16px;">
        ${data.gaps.map(g => `
          <div class="card app-finding">
            <div class="dim">${g.gap_type} — ${g.severity}</div>
            <div>${g.description}</div>
          </div>
        `).join("")}
      </div>
    ` : ""}

    ${data.next_actions && data.next_actions.length ? `
      <h3 class="h3" style="margin-top:32px;">Next actions</h3>
      <div style="margin-top:16px;">
        ${data.next_actions.map(a => `
          <div class="card app-finding">
            <div class="dim">${a.recommendation_type} — ${a.status}</div>
            <div>${a.rationale}</div>
          </div>
        `).join("")}
      </div>
    ` : ""}

    ${data.readiness ? `
      <h3 class="h3" style="margin-top:32px;">Readiness</h3>
      <div class="card card-body" style="margin-top:16px;">
        <p><strong style="color:var(--ink);">${data.readiness.overall_band}</strong></p>
        <p>${data.readiness.reasoning || ""}</p>
      </div>
    ` : ""}

    <button class="btn btn-primary" style="margin-top:32px;" id="resume-cta">${data.resume_cta_label}</button>
    <div id="resume-note" style="margin-top:12px;"></div>
  `;

  document.getElementById("resume-cta").addEventListener("click", () => {
    document.getElementById("resume-note").innerHTML = `<div class="app-banner app-banner-info">
      Generating a new resume for a Career Intelligence target isn't available on rithavo.com yet.
    </div>`;
  });
})();
</script>
</body>
</html>
