<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Offline — Rithavo</title>
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="/styles.css?v=20261106">
<link rel="stylesheet" href="/pwa.css">
</head>
<body>
<main class="pwa-offline" id="main">
  <svg class="mark" viewBox="0 0 24 24" aria-hidden="true" width="40" height="40">
    <path d="M4 5 L12.5 12 L4 19" fill="none" stroke="var(--g1)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/>
    <path d="M11 4 L21 12 L11 20" fill="none" stroke="var(--g3)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h1 class="h2">You're offline</h1>
  <p class="body-md">Rithavo needs a connection to load your profile, resumes and results. Nothing you've done is lost. Reconnect and try again.</p>
  <button type="button" class="btn btn-primary" id="retry">Try again</button>
  <p class="pwa-offline-note" id="status" role="status" aria-live="polite"></p>
</main>
<script>
(function () {
  var status = document.getElementById("status");
  function retry() { window.location.reload(); }
  document.getElementById("retry").addEventListener("click", function () {
    status.textContent = navigator.onLine ? "Trying again…" : "Still offline. Check your connection.";
    if (navigator.onLine) retry();
  });
  window.addEventListener("online", retry);
})();
</script>
</body>
</html>
