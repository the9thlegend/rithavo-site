<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Resumes — Rithavo</title>
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preload" href="/assets/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<link rel="stylesheet" href="/styles.css?v=20261106">
<link rel="stylesheet" href="/app-shell.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121116" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/assets/pwa/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rithavo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="/pwa.css">
</head>
<body>
<script src="/assets/ritanya/ritanya.js?v=20261106" defer></script>
<div class="app-topbar" id="app-topbar"></div>

<div class="app-main">
  <p class="label">Resumes</p>
  <h1 class="h2" style="margin:8px 0 24px;">Your resumes</h1>
  <div id="content" class="app-skeleton">Loading…</div>
</div>

<script src="/app-shell.js?v=20261106"></script>
<script>
(async () => {
  const me = await RithavoApp.requireSession();
  if (!me) return;
  RithavoApp.renderTopbar("resumes", me.email, me.is_super_admin);

  const content = document.getElementById("content");
  try {
    const rows = await RithavoApp.apiJson("/resumes");
    if (!rows.length) {
      content.innerHTML = `<div class="app-empty">No resumes yet. Resumes are created from an Application Diagnostic.</div>`;
      return;
    }
    content.innerHTML = `<ul class="app-list">${rows.map(r => `
      <li class="card app-list-row">
        <div>
          <strong>${r.label || "Resume"}</strong>
          <div class="meta">${r.target_context || ""} · created ${r.created_at ? r.created_at.slice(0, 10) : ""}</div>
        </div>
        ${r.downloadable
          ? `<a class="btn btn-ghost" style="padding:8px 16px; font-size:0.8rem;" href="/api/resume/${r.id}/download">Download</a>`
          : `<span class="meta">Not downloadable here</span>`}
      </li>
    `).join("")}</ul>`;
  } catch (err) {
    content.innerHTML = `<div class="app-banner app-banner-error">${err.message}</div>`;
  }
})();
</script>
<script src="/pwa.js?v=20261106" defer></script>
</body>
</html>
